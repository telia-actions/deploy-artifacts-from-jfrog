name: 'Deploy artifacts to IIS using WebDeploy'
description: 'Download artifacts from JFrog by given repository name and unique string (usually short git sha) in the artifact name and deploys to given server. Uses Powershell.'
inputs:
  local-storage-path:
    description: 'Optional path of local (usually self-hosted) runner''s directory where artifacts might be stored for faster access (instead of downloading from JFrog and extracting). Action continues with searching in JFrog if no matches found locally.'
    required: false
  jfrog-repo-name:
    description: 'Name of JFrog repository to download from. Checking only local-storage-path if no value provided.'
    required: false
  jfrog-username:
    description: 'JFrog username to use for downloading artifact. Should have READ permissions.'
    required: false
  jfrog-password:
    description: 'JFrog user password'
    required: false
  search-phrase:
    description: 'Substring of artifact name, usually short GIT SHA. Can be multiple search phrases delimited by triple pipe sign |||. In that case corresponding target parameters (runner-destination-path, server-iis-site-name or server-destination-path) should have the same number of values delimited by triple pipe sign |||.'
    required: true
  search-phrase-cleanup:
    description: 'Flag indicating if search-phrase input should be cleaned from spaces. Accepts "True" or "False" values. "True" by default'
    required: false
  archive-extension:
    description: 'Extension of artifact archive file'
    required: true
    default: 'zip'
  runner-destination-path:
    description: 'Path to runner''s directory to download artifact to. Deployment part will be skipped if this parameter is provided. This is useful if you need to do some additional steps before deploying to the server.'
    required: false
  runner-source-path:
    description: 'Path to runner''s directory where artifact was previously downloaded. Local storage and JFrog are not checked if this parameter is provided. This is used as a deploy step if you need to do some addtional steps before deploying to the server (see parameter runner-destination-path).'
    required: false
  server-msdeploy-url:
    description: 'Url of server msdeploy, usually in format of https://some-server-name:8172/msdeploy.axd'
    required: true
  server-msdeploy-username:
    description: 'Server username to use for deploying'
    required: true
  server-msdeploy-password:
    description: 'Server user password to use for deploying'
    required: true
  server-iis-site-name:
    description: 'Name of the IIS site on the server. Either this or server-destination-path is required.'
    required: false
  server-destination-path:
    description: 'Path on server to install application to. Either this or server-iis-site-name is required'
    required: false
  presync-command-file-path:
    description: 'Path to cmd file to run before installation'
    required: false
  postsync-command-file-path:
    description: 'Path to cmd file to run after installation'
    required: false
  application-path:
    description: 'Optional sub-path of application in JFrog artifact (in case archive contains more than one application or application source is in some sub-folder)'
    required: false
  msdeploy-skip-parameter:
    description: 'Optional MsDeploy -skip parameter value. For example, objectName=dirPath,absolutePath=Logs, or objectName=filePath,absolutePath=site.config. For multiple values pass semicolon separated values, for example, "objectName=appPool;objectName=application"'

runs:
  using: "composite"
  steps:
    - name: Download artifact
      shell: powershell
      run: |
        
        function WriteLog {
          param (
            [Parameter(Mandatory)]
            [string]$Text
          )
          
          Write-Host "$(Get-Date -Format o): " -NoNewline -BackgroundColor DarkMagenta -ForegroundColor Yellow
          Write-Host $Text -BackgroundColor DarkMagenta -ForegroundColor Gray
        }
        
        
        function Split-NonEmpty {
          param (
            [Parameter(Mandatory)]
            [AllowEmptyString()]
            [string]$InputString
          )
          
          ,@($InputString -split "\|\|\|" |
          ForEach-Object { $_.Trim() } |
          Where-Object { $_ -ne '' })
        }
        
        
        $searchValue = "${{ inputs.search-phrase }}"
        $runnerSourcePath = "${{ inputs.runner-source-path }}"
        if ("${{ inputs.search-phrase-cleanup }}" -ne "False") {
          $searchValue = $searchValue.Replace(" ", "")
        }
        
        if (!$searchValue -and !$runnerSourcePath) {
          throw "search-phrase or runner-source-path parameter is required."
        }
        
        if (!$searchValue -and !!$runnerSourcePath) {
          $searchValue = $runnerSourcePath #dummy assignment in cases when no actual search is needed, only deployment from runner's source path. This is to be able to use the same "foreach ($search in $searchValues)" loop
        }
        
        $searchValues = Split-NonEmpty($searchValue)
        $targetSites = Split-NonEmpty("${{ inputs.server-iis-site-name }}")
        $targetPaths = Split-NonEmpty("${{ inputs.server-destination-path }}")
        $targetRunnerPaths = Split-NonEmpty("${{ inputs.runner-destination-path }}")
        $sourceRunnerPaths = Split-NonEmpty($runnerSourcePath)
        
        if (($targetSites.Count -ne $searchValues.Count) -and ($targetPaths.Count -ne $searchValues.Count) -and ($targetRunnerPaths.Count -ne $searchValues.Count)) {
          throw "Missing or incorrect parameter value: either server-iis-site-name, server-destination-path or runner-destination-path must be provided and have the same number of delimited elements as provided search-phrase"
        }
        
        $index = 0
        foreach ($search in $searchValues) {
          $firstArtifact = $null
          $tempArtifactPathOnRunner = "${{ github.workspace }}\_deploy"
          $localStoragePath = "${{ inputs.local-storage-path }}"
          $jfrogRepo = "${{ inputs.jfrog-repo-name }}"
          
          $runnerSourcePath = $sourceRunnerPaths[$index]
          $runnerDestinationPath = $targetRunnerPaths[$index]
          $targetSite = $targetSites[$index]
          $targetPath = $targetPaths[$index]
          
          if (!!$runnerDestinationPath) {
            $tempArtifactPathOnRunner = $runnerDestinationPath
          }
          
          if (!!$runnerSourcePath) {
            $tempArtifactPathOnRunner = $runnerSourcePath
          }
          
          #Some validations
          if (!$jfrogRepo -and !$localStoragePath -and !$runnerSourcePath) {
            throw "A value for at least on of 'local-storage-path', 'jfrog-repo-name' or 'runner-source-path' parameters should be provided"
          }
          
          # Checking local storage first
          if (!!$localStoragePath -and !$runnerSourcePath) {
            WriteLog("Searching for artifact with '$search' in local storage '$localStoragePath'")
            $results = Get-ChildItem -Path "$localStoragePath" -Filter "*$search*"
            $firstArtifact = $results | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            
            if (!$firstArtifact) {
              WriteLog("No artifact found in local storage '$localStoragePath'")
            } else {
              WriteLog("Found artifact '$firstArtifact', copying to '$tempArtifactPathOnRunner'")
              $options = @("*.*", "/s", "/COPY:DAT", "/NODCOPY")
              $args = @("$localStoragePath\$firstArtifact", $tempArtifactPathOnRunner) + $options
              
              $p = Start-Process -FilePath robocopy -ArgumentList $args -Wait -PassThru -NoNewWindow
              $rc = $p.ExitCode
              
              if ($rc -ge 8) {
                  throw "Robocopy failed with exit code $rc."
              } else {
                  Write-Host "Robocopy completed with exit code $rc."
              }
            }
          }
          
          # Searching in JFrog
          if (!$firstArtifact -and !!$jfrogRepo -and !$runnerSourcePath) {
            WriteLog("Searching for artifact with '$search' in JFrog repository '$jfrogRepo'")
            
            $authHeaderValue = "Basic " + [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${{ inputs.jfrog-username }}:${{ inputs.jfrog-password }}"))
            $response = Invoke-WebRequest `
              -Method Get `
              -Uri "https://jfrog.teliacompany.io/artifactory/api/search/artifact?name=$search&repos=$jfrogRepo" `
              -Headers @{ "Authorization" = $authHeaderValue; "X-Result-Detail" = "info" } `
              -UseBasicParsing
            
            $results = (ConvertFrom-Json -InputObject ([System.Text.Encoding]::UTF8.GetString($response.Content))).results
            $firstArtifact = $results | Sort-Object created -Descending | Select-Object -First 1
            
            if (!$firstArtifact) {
              throw "No artifact found with GIT commit hash in JFrog ${{ inputs.commit_hash }}"
            }
            
            WriteLog("Downloading artifact '$firstArtifact'")
            
            Invoke-WebRequest `
              -Method Get `
              -Uri $firstArtifact.downloadUri `
              -Headers @{ "Authorization" = $authHeaderValue } `
              -OutFile "${{ github.workspace }}\Artifact.${{ inputs.archive-extension }}" `
              -UseBasicParsing
            
            WriteLog("Extracting artifact to '$tempArtifactPathOnRunner'")
            
            $artifactZip = "${{ github.workspace }}\Artifact.${{ inputs.archive-extension }}"
            Expand-Archive -Path $artifactZip -DestinationPath $tempArtifactPathOnRunner -Force
          }
          
          if (!$firstArtifact -and !$runnerSourcePath) {
            throw "No artifact found with GIT commit hash ${{ inputs.commit_hash }}"
          }
          
          if (!$runnerDestinationPath) { #skipping deploy part if runner-destination-path parameter was provided.
            $msdeployPath = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
            
            if (!(Test-Path $msdeployPath)) {
              WriteLog("Web Deploy installation not found, downloading and installing")
              
              # URL for Web Deploy installer
              $url = "https://download.microsoft.com/download/0/1/D/01DC28EA-638C-4A22-A57B-4CEF97755C6C/WebDeploy_amd64_en-US.msi"
              
              # Define the output location for the installer
              $output = "$env:TEMP\WebDeploy_amd64_en-US.msi"
              echo $output
              
              # Download the installer
              Invoke-WebRequest -Uri $url -OutFile $output
              
              # Install Web Deploy
              Start-Process msiexec.exe -Wait -ArgumentList "/I $output /quiet /qn /norestart" -verbose
              
              # Remove the installer
              Remove-Item -Path $output
              
              WriteLog("Web Deploy installed successfully")
            }
            
            
            $arguments = @(
                "-verb:sync",
                "-AllowUntrusted",
                "-verbose",
                "-enableRule:AppOffline"
            )
            
            if (!!$targetSite) {
              $logTarget = "Site: '$targetSite'"
              $arguments += @(
                '-dest:iisApp=' + $targetSite + ',computerName=${{ inputs.server-msdeploy-url }},username=${{ inputs.server-msdeploy-username }},password="${{ inputs.server-msdeploy-password }}",authtype=Basic,includeAcls=False'
                "-source:iisApp=$tempArtifactPathOnRunner\${{ inputs.application-path }}"
              )
            } else {
              $logTarget = "dir: '$targetPath'"
              $arguments += @(
                '-dest:dirPath="' + $targetPath + '",computerName=${{ inputs.server-msdeploy-url }},username=${{ inputs.server-msdeploy-username }},password="${{ inputs.server-msdeploy-password }}",authtype=Basic,includeAcls=False'
                "-source:dirPath=$tempArtifactPathOnRunner\${{ inputs.application-path }}"
              )
            }
            
            if (!!"${{ inputs.msdeploy-skip-parameter }}") {
              foreach ($skipParam in "${{ inputs.msdeploy-skip-parameter }}".Split(";")) {
                $arguments += "-skip:$skipParam"
              }
            }
            
            if (!!"${{ inputs.presync-command-file-path }}") {
              $arguments += '-preSync:runCommand="${{ inputs.presync-command-file-path }}",waitInterval=30000'
            }
            
            if (!!"${{ inputs.postsync-command-file-path }}") {
              $arguments += '-postSync:runCommand="${{ inputs.postsync-command-file-path }}",waitInterval=30000'
            }
            
            $max_retries = 3
            $retries = 0
            
            WriteLog("Deploy arguments debug start:")
            echo $arguments
            WriteLog("Deploy arguments debug end")
            
            do {
              WriteLog("Deploying to '${{ inputs.server-msdeploy-url }}', $logTarget")
              
              try {
                & $msdeployPath $arguments
                
                if ($lastexitcode -ne 0) {
                  echo "Last exit code = $lastexitcode"
                  throw
                }
                
                WriteLog("Done!")
                break;
                
              } catch {
                if ($retries -lt $max_retries) {
                  WriteLog("Failed. Retrying in a few seconds.")
                  $retries++
                  Start-Sleep -Milliseconds (3000 * $retries * $retries) #increasing time gaps between retries (3 secs, 12 secs, 27 secs)
                } else {
                  WriteLog("Deployment failed after $max_retries retries.")
                  $max_retries = 0
                }
              }
            } while ($max_retries -ne 0)
            
            # Clearing deploy folder just in case some other deploys are to be done in the same workflow.
            Get-ChildItem $tempArtifactPathOnRunner | Remove-Item -recurse -Force
          }
          
          $index++
        }